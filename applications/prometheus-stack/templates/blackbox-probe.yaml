apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: external-os2ai-probe
  namespace: monitoring
  labels:
    release: prometheus-stack
spec:
  interval: 30s
  module: http_2xx
  prober:
    url: prometheus-stack-prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://demo.os2ai.dk
