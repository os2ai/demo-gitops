apiVersion: v1
kind: ConfigMap
metadata:
  name: helbred-dashboard
  labels:
     grafana_dashboard: "1"
  annotations:
     grafana_folder: "common"
data:
  helbred-dashboard.yaml: |
    annotations:
      - kind: AnnotationQuery
        spec:
          query:
            kind: DataQuery
            group: grafana
            version: v0
            datasource:
              name: '-- Grafana --'
            spec: {}
          enable: true
          hide: true
          iconColor: rgba(0, 211, 255, 1)
          name: Annotations & Alerts
          builtIn: true
    cursorSync: 'Off'
    description: ''
    editable: true
    elements:
      panel-1:
        kind: Panel
        spec:
          id: 1
          title: 'Helbred: Mistral'
          description: ''
          links: []
          data:
            kind: QueryGroup
            spec:
              queries:
                - kind: PanelQuery
                  spec:
                    query:
                      kind: DataQuery
                      group: prometheus
                      version: v0
                      datasource:
                        name: prometheus
                      spec:
                        editorMode: builder
                        expr: probe_success{job="probe/monitoring/chatcheck"}
                        legendFormat: __auto
                        range: true
                    refId: A
                    hidden: false
              transformations: []
              queryOptions: {}
          vizConfig:
            kind: VizConfig
            group: stat
            version: 13.2.0
            spec:
              options:
                colorMode: background
                graphMode: none
                justifyMode: auto
                orientation: auto
                percentChangeColorMode: standard
                reduceOptions:
                  calcs:
                    - last
                  fields: ''
                  values: false
                showPercentChange: false
                textMode: auto
                wideLayout: true
              fieldConfig:
                defaults:
                  mappings:
                    - type: value
                      options:
                        '0':
                          text: NEDDE
                          color: red
                          index: 1
                        '1':
                          text: OPPE
                          color: green
                          index: 0
                  thresholds:
                    mode: absolute
                    steps:
                      - value: 0
                        color: green
                  color:
                    mode: thresholds
                    fixedColor: '#ad46ff'
                overrides: []
      panel-2:
        kind: Panel
        spec:
          id: 2
          title: 'Helbred: Forside'
          description: ''
          links: []
          data:
            kind: QueryGroup
            spec:
              queries:
                - kind: PanelQuery
                  spec:
                    query:
                      kind: DataQuery
                      group: prometheus
                      version: v0
                      datasource:
                        name: prometheus
                      spec:
                        editorMode: builder
                        expr: probe_success{job="probe/monitoring/landingpage"}
                        legendFormat: __auto
                        range: true
                    refId: A
                    hidden: false
              transformations: []
              queryOptions: {}
          vizConfig:
            kind: VizConfig
            group: stat
            version: 13.2.0
            spec:
              options:
                colorMode: background
                graphMode: none
                justifyMode: auto
                orientation: auto
                percentChangeColorMode: standard
                reduceOptions:
                  calcs:
                    - last
                  fields: ''
                  values: false
                showPercentChange: false
                textMode: auto
                wideLayout: true
              fieldConfig:
                defaults:
                  mappings:
                    - type: value
                      options:
                        '0':
                          text: NEDE
                          color: red
                          index: 1
                        '1':
                          text: OPPE
                          color: green
                          index: 0
                  thresholds:
                    mode: absolute
                    steps:
                      - value: 0
                        color: green
                  color:
                    mode: thresholds
                    fixedColor: '#ad46ff'
                overrides: []
      panel-3:
        kind: Panel
        spec:
          id: 3
          title: 'Svartid: Forside'
          description: ''
          links: []
          data:
            kind: QueryGroup
            spec:
              queries:
                - kind: PanelQuery
                  spec:
                    query:
                      kind: DataQuery
                      group: prometheus
                      version: v0
                      datasource:
                        name: prometheus
                      spec:
                        editorMode: builder
                        expr: >-
                          probe_http_duration_seconds{job="probe/monitoring/landingpage",
                          phase="resolve"}
                        legendFormat: __auto
                        range: true
                    refId: A
                    hidden: false
              transformations: []
              queryOptions: {}
          vizConfig:
            kind: VizConfig
            group: timeseries
            version: 13.2.0
            spec:
              options:
                legend:
                  calcs: []
                  displayMode: list
                  placement: bottom
                  showLegend: false
                tooltip:
                  hideZeros: false
                  mode: single
                  sort: none
              fieldConfig:
                defaults:
                  thresholds:
                    mode: percentage
                    steps:
                      - value: 0
                        color: green
                      - value: 40
                        color: '#EAB839'
                      - value: 60
                        color: red
                  color:
                    mode: palette-classic
                    seriesBy: last
                  custom:
                    axisBorderShow: false
                    axisCenteredZero: false
                    axisColorMode: text
                    axisLabel: Sekunder
                    axisPlacement: auto
                    axisSoftMax: 0.25
                    barAlignment: 0
                    barWidthFactor: 0.6
                    drawStyle: line
                    fillOpacity: 27
                    gradientMode: opacity
                    hideFrom:
                      legend: false
                      tooltip: false
                      viz: false
                    insertNulls: false
                    lineInterpolation: linear
                    lineStyle:
                      fill: solid
                    lineWidth: 1
                    pointSize: 5
                    scaleDistribution:
                      type: linear
                    showPoints: auto
                    showValues: false
                    spanNulls: false
                    stacking:
                      group: A
                      mode: none
                    thresholdsStyle:
                      mode: 'off'
                overrides: []
      panel-4:
        kind: Panel
        spec:
          id: 4
          title: 'Svartid: Mistral'
          description: ''
          links: []
          data:
            kind: QueryGroup
            spec:
              queries:
                - kind: PanelQuery
                  spec:
                    query:
                      kind: DataQuery
                      group: prometheus
                      version: v0
                      datasource:
                        name: prometheus
                      spec:
                        editorMode: builder
                        expr: >-
                          probe_http_duration_seconds{job="probe/monitoring/chatcheck",
                          phase="resolve"}
                        legendFormat: __auto
                        range: true
                    refId: A
                    hidden: false
              transformations: []
              queryOptions: {}
          vizConfig:
            kind: VizConfig
            group: timeseries
            version: 13.2.0
            spec:
              options:
                legend:
                  calcs: []
                  displayMode: list
                  placement: bottom
                  showLegend: false
                tooltip:
                  hideZeros: false
                  mode: single
                  sort: none
              fieldConfig:
                defaults:
                  thresholds:
                    mode: percentage
                    steps:
                      - value: 0
                        color: green
                      - value: 40
                        color: '#EAB839'
                      - value: 60
                        color: red
                  color:
                    mode: palette-classic
                    seriesBy: last
                  custom:
                    axisBorderShow: false
                    axisCenteredZero: false
                    axisColorMode: text
                    axisLabel: Sekunder
                    axisPlacement: auto
                    axisSoftMax: 0.25
                    barAlignment: 0
                    barWidthFactor: 0.6
                    drawStyle: line
                    fillOpacity: 27
                    gradientMode: opacity
                    hideFrom:
                      legend: false
                      tooltip: false
                      viz: false
                    insertNulls: false
                    lineInterpolation: linear
                    lineStyle:
                      fill: solid
                    lineWidth: 1
                    pointSize: 5
                    scaleDistribution:
                      type: linear
                    showPoints: auto
                    showValues: false
                    spanNulls: false
                    stacking:
                      group: A
                      mode: none
                    thresholdsStyle:
                      mode: 'off'
                overrides: []
    layout:
      kind: AutoGridLayout
      spec:
        maxColumnCount: 3
        columnWidthMode: standard
        rowHeightMode: standard
        fillScreen: true
        items:
          - kind: AutoGridLayoutItem
            spec:
              element:
                kind: ElementReference
                name: panel-2
          - kind: AutoGridLayoutItem
            spec:
              element:
                kind: ElementReference
                name: panel-1
          - kind: AutoGridLayoutItem
            spec:
              element:
                kind: ElementReference
                name: panel-3
          - kind: AutoGridLayoutItem
            spec:
              element:
                kind: ElementReference
                name: panel-4
    links: []
    liveNow: false
    preload: false
    tags: []
    timeSettings:
      timezone: browser
      from: now-6h
      to: now
      autoRefresh: ''
      autoRefreshIntervals:
        - 5s
        - 10s
        - 30s
        - 1m
        - 5m
        - 15m
        - 30m
        - 1h
        - 2h
        - 1d
      hideTimepicker: false
      fiscalYearStartMonth: 0
    title: Helbred
    variables: []
    preferences:
      layout:
        kind: AutoGridLayout
        spec:
          maxColumnCount: 3
          columnWidthMode: standard
          rowHeightMode: standard
          items: []
