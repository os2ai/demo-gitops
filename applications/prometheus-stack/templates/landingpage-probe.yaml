apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: landingpage
  namespace: monitoring
  labels:
    release: prometheus-stack
spec:
  interval: 30s
  module: http_2xx
  prober:
    url: prometheus-stack-prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://{{ .Values.domain }}/
