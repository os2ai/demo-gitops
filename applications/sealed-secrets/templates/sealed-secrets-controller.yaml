apiVersion: v1
kind: Service
metadata:
  name: sealed-secrets-controller
  labels:
    app.kubernetes.io/name: sealed-secrets
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: http
  selector:
    # Must track the release name: the upstream chart labels its pods with
    # app.kubernetes.io/instance = <Helm release name>. A hardcoded value
    # silently produces an endpointless Service (kubeseal hangs instead of
    # failing) whenever the wrapper is installed under a different release name.
    app.kubernetes.io/name: sealed-secrets
    app.kubernetes.io/instance: {{ .Release.Name }}
